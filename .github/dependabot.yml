version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The RustCrypto cipher/digest set (aes/ctr/hmac/pbkdf2/sha1) is one matched
      # group. Our WinZip-AE code in archive-core/src/zip/aes.rs calls them
      # directly (pbkdf2_hmac::<Sha1>, Hmac/Mac, Ctr128LE, Aes*) and they share a
      # single `digest`/`crypto-common` generation, so a major bump on any one
      # forces a coordinated rewrite of all five — for zero functional gain, since
      # the ZIP AE algorithm is spec-fixed. Hold the whole set until we choose to
      # do that work in one PR. (The `zip` dep that also pulls aes 0.8 is dev-only,
      # so this is about the API rewrite, not the shipped binary.) Tracked in #9.
      - dependency-name: "aes"
      - dependency-name: "ctr"
      - dependency-name: "hmac"
      - dependency-name: "pbkdf2"
      - dependency-name: "sha1"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    ignore:
      # dtolnay/rust-toolchain's git tag IS the Rust version it installs;
      # @1.88.0 in ci.yml pins our MSRV. Dependabot bumping it broke CI by
      # trying to install unreleased Rust 1.100 (#2). MSRV is raised by hand.
      - dependency-name: "dtolnay/rust-toolchain"
