[package]
name = "archive-dev"
version = "0.0.0"
edition = "2024"
publish = false

# This crate is a scratchpad for experiments, quick tests against
# real files, and throwaway code. It is NOT part of the production
# build and should never be depended on by other crates.

[dependencies]
archive-core = { path = "../archive-core" }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
