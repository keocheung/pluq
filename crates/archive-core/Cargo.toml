[package]
name = "archive-core"
version = "0.1.0"
edition = "2024"


[dependencies]
aes = "0.8"
blake2s_simd = "1"
bytes = "1"
crc32fast = "1"
ctr = "0.9"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
pbkdf2 = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
unrar = "0.5"

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
