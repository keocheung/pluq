[package]
name = "archive-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true


[dependencies]
aes = "0.8"
blake2s_simd = "1"
bytes = "1"
crc32fast = "1"
ctr = "0.9"
encoding_rs = "0.8"
chardetng = "1"
bzip2 = "0.6"
xz2 = "0.1"
zstd = "0.13"
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
pbkdf2 = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
unrar = "0.5"
deflate64 = "0.1"

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
wiremock = "0.6"
lzma-rs = "0.3"
zip = { version = "8", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma", "aes-crypto"] }
