[package]
name = "archive"
version = "0.1.0"
edition = "2024"

[dependencies]
archive-core = { path = "../archive-core" }
bytes = "1"
dirs = "6"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bytes = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "2", features = ["aes-crypto"] }
