[package]
name = "archive-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros", "rt", "signal"] }
thiserror = "2"
tracing = "0.1"
directories = "5"
webbrowser = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
