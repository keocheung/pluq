[package]
name = "archive-cache"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true

[dependencies]
archive = { path = "../archive" }
archive-core = { path = "../archive-core" }
archive-source = { path = "../archive-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dirs = "6"
tracing = "0.1"
tokio = { version = "1", features = ["io-util"] }
bytes = "1"

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
