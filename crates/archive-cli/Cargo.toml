[package]
name = "archive-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
archive-core = { path = "../archive-core" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
