[package]
name = "pluq"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Surgical archive extraction from local and cloud storage — snipe one file out of a huge ZIP/RAR without downloading the whole thing."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["archive", "zip", "rar", "extraction", "cli"]
categories = ["command-line-utilities", "compression", "filesystem"]

[package.metadata.wix]
upgrade-guid = "D6A827DA-7FCB-4872-A760-1C42E55F8C0C"
path-guid = "D77BCD17-A83A-4A7B-91A1-2EB681B3937F"
license = false
eula = false

[[bin]]
name = "pluq"
path = "src/main.rs"

[dependencies]
archive = { path = "../archive" }
archive-cache = { path = "../archive-cache" }
archive-gdrive = { path = "../archive-gdrive" }
archive-dropbox = { path = "../archive-dropbox" }
archive-source = { path = "../archive-source" }
archive-auth = { path = "../archive-auth" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
glob = "0.3"
indicatif = "0.18"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
human-panic = "2"
os_info = "3"
webbrowser = "1"


[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
