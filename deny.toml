# cargo-deny configuration — supply-chain + license gate.
# Schema targets cargo-deny 0.16+ (removed keys such as `advisories.vulnerability`
# are intentionally absent — including them now errors).
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# RustSec advisory DB. Vulnerabilities / unsound advisories are denied by default
# in 0.16+. List specific advisory IDs here to ignore them.
ignore = []

[licenses]
# Slightly relaxed confidence so license text inferred from files still matches.
confidence-threshold = 0.8
# Permissive + weak-copyleft (MPL is file-level) licenses present in the dep tree.
# Note: `directories` -> `option-ext` pulls MPL-2.0; rustls crypto backends
# (`ring` / `aws-lc-rs`) may carry an OpenSSL-tagged license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
exceptions = []
# Our own workspace crates (some are publish = false) — skip linting their licenses.
private = { ignore = true }

[bans]
# Workspaces routinely carry duplicate transitive versions and a few caret reqs;
# surface them but don't fail CI on them at v0.1.0.
multiple-versions = "warn"
wildcards = "warn"
# Guardrail for the RustCrypto cipher/digest set (see issue #9): globally we only
# warn on duplicates, but aes/ctr/hmac/pbkdf2/sha1 must each stay single-version.
# If a partial bump lands one crate at a new major while the rest (or the dev-only
# `zip` dep, which still pulls the 0.8-era set via aes-crypto) hold the old major,
# two versions enter the tree — fail CI rather than ship a desynced crypto stack.
deny = [
    { name = "aes", deny-multiple-versions = true },
    { name = "ctr", deny-multiple-versions = true },
    { name = "hmac", deny-multiple-versions = true },
    { name = "pbkdf2", deny-multiple-versions = true },
    { name = "sha1", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The unrar fork is patched in via [patch.crates-io] in the root Cargo.toml.
allow-git = ["https://github.com/stefandekanski/unrar.rs"]
